# ============================================================
#  Shared configuration for both services (auth + resource)
# ============================================================

oauth.config.path=config/auth.json

# Scopes granted to confidential clients in the client_credentials grant (auth server only).
oauth.client-scopes.payments-service=payments:read payments:write

spring.datasource.url=jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:init.sql

spring.data.redis.host=localhost
spring.data.redis.port=6379

logging.level.org.hibernate.SQL=warn
